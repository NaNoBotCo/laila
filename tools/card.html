<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&display=swap" rel="stylesheet">
<style>html,body{margin:0}body{width:1200px;height:630px;background:#fdfbf6;font-family:-apple-system,Helvetica,Arial,sans-serif;display:flex;align-items:center;overflow:hidden;position:relative}
.l{padding:0 70px;flex:1}.cr{font-size:80px;color:#b08a3e;line-height:1}
h1{font-family:'Cormorant Garamond',Georgia,serif;font-size:96px;line-height:.98;margin:10px 0 18px;color:#1c1a17}
h1 em{font-style:normal;color:#b08a3e}.s{font-size:28px;color:#77706a}
.r{width:430px;height:430px;margin-right:70px;position:relative}
.ph{position:absolute;inset:32%;background:#06c755;border-radius:24%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:34px}
.r i{position:absolute;width:64px;height:64px;border-radius:50%;background:#fff;border:3px solid #e9dcc0;display:grid;place-items:center;font-style:normal;font-size:32px;transform:translate(-50%,-50%)}
</style></head><body>
<div class="l"><div class="cr">♛</div><h1>Laila.<br>Twenty businesses.<br><em>One LINE.</em></h1><div class="s">Ten working demos · motdang.net</div></div>
<div class="r" id="r"><svg viewBox="0 0 100 100" id="sv" style="position:absolute;inset:0"></svg><div class="ph">LINE</div></div>
<script>const ic=['💱','🛂','🚤','🚐','🛵','👜','🛏️','🏠','🧾','📊','🗺️','🎫'];ic.forEach((t,k)=>{const a=k/ic.length*Math.PI*2-Math.PI/2,x=50+42*Math.cos(a),y=50+42*Math.sin(a);const i=document.createElement('i');i.textContent=t;i.style.left=x+'%';i.style.top=y+'%';r.appendChild(i);sv.insertAdjacentHTML('beforeend',`<line x1="50" y1="50" x2="${x}" y2="${y}" stroke="#e9dcc0" stroke-width=".8" stroke-dasharray="1.5 1.5"/>`)});</script>
</body></html>
