<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>One LINE · Laila</title>
<meta name="description" content="Every business in one LINE chat: a morning message, one-tap yes or no, questions answered.">
<meta property="og:title" content="One LINE · Laila"><meta property="og:image" content="https://nanobotco.github.io/laila/card.png"><meta property="og:image:alt" content="Laila. Twenty businesses. One LINE. Ten working demos from motdang.net">
<link rel="stylesheet" href="../deck.css?v=4">
<style>
.wrap{display:grid;grid-template-columns:380px 1fr;gap:34px;align-items:start}
@media (max-width:820px){.wrap{grid-template-columns:1fr}}
.phone{width:100%;max-width:380px;margin:auto;background:#111;border-radius:42px;padding:12px;box-shadow:0 20px 60px -20px rgba(0,0,0,.45)}
.screen{background:#8cabd9;border-radius:32px;overflow:hidden;height:680px;display:flex;flex-direction:column}
.top{background:#2b3a55;color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;font-weight:600}
.top .av{width:32px;height:32px;border-radius:50%;background:var(--gold);display:grid;place-items:center}
.chat{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:86%;background:#fff;border-radius:4px 18px 18px 18px;padding:10px 12px;font-size:15px;line-height:1.4;animation:pop .25s ease-out}
.msg.me{align-self:flex-end;background:#a3e98b;border-radius:18px 4px 18px 18px}
@keyframes pop{from{transform:scale(.9);opacity:0}}
.msg .t{font-size:12px;color:#888}
.msg table{border-collapse:collapse;width:100%;font-size:14px;margin:6px 0}
.msg td{padding:3px 0;border-bottom:1px solid #f0f0f0}
.msg td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.msg .big{font-size:22px;font-weight:800}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.acts button{border:1px solid #06c755;color:#06a548;background:#fff;border-radius:999px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}
.acts button:disabled{opacity:.45;cursor:default}
.bill{display:flex;align-items:center;gap:8px;border-top:1px solid #f0f0f0;padding:8px 0}
.bill:first-of-type{border-top:0}
.bill .w{flex:1}
.bill button{width:36px;height:36px;border-radius:50%;border:0;font-size:18px;cursor:pointer}
.y{background:#06c755;color:#fff}.n{background:#eee}
.inp{display:flex;gap:8px;padding:10px;background:#fff}
.inp input{border-radius:999px;padding:10px 14px}
.inp button{border:0;background:#06c755;color:#fff;border-radius:50%;width:44px;height:44px;font-size:18px;cursor:pointer}
.side .chip{display:block;width:100%;text-align:left;margin-bottom:8px}
@media (max-width:820px){.screen{height:70vh;min-height:480px}}
</style>
</head><body>
<main>
<span class="try">Try it · tap anything</span>
<h1>Twenty businesses.<br><em>One chat.</em></h1>
<div class="wrap">
  <div class="phone noswipe"><div class="screen">
    <div class="top"><div class="av">♛</div>Laila Group · panel</div>
    <div class="chat" id="chat"></div>
    <form class="inp" id="f"><input id="q" type="text" placeholder="Ask anything…" autocomplete="off"><button aria-label="Send">➤</button></form>
  </div></div>
  <div class="side">
    <div class="panel">
      <h2>Ask</h2>
      <button class="chip" data-q="How much did the exchange make in September?">💱 Exchange, September?</button>
      <button class="chip" data-q="Which bills are due this week?">🧾 Bills this week?</button>
      <button class="chip" data-q="How full is the hostel tonight?">🛏️ Hostel tonight?</button>
      <button class="chip" data-q="Visa cases due?">🛂 Visa cases due?</button>
      <button class="chip" data-q="What are we paying for that nobody uses?">✂️ Paying for nothing?</button>
      <button class="chip" data-q="ยอดขายวันนี้เท่าไหร่">🇹🇭 ยอดขายวันนี้เท่าไหร่</button>
    </div>
    <p class="small" style="margin-top:12px">Sample numbers. The live panel reads your own sheets.</p>
  </div>
</div>
</main>
<script>
const chat=document.getElementById('chat');
const fmt=n=>'฿'+n.toLocaleString('en-US');
function say(html,me,delay=0){return new Promise(r=>setTimeout(()=>{const d=document.createElement('div');d.className='msg'+(me?' me':'');d.innerHTML=html;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;r(d)},delay))}
const BIZ=[['💱','Exchange',52300,8100],['🚤','Slow boat',33800,21400],['🚐','Day tours',18600,9200],['🛵','Cars & scooters',9700,1800],['🛂','Visa',41500,6300],['👜','Consignment',14200,9900],['🛏️','Hostel',11900,4200],['🏠','Property',4400,10350]];
const tin=BIZ.reduce((a,b)=>a+b[2],0),tout=BIZ.reduce((a,b)=>a+b[3],0);
function morning(){
  return say(`<div class="t">08:00 · Thursday</div>☀️ Good morning, Laila.<div class="big">In ${fmt(tin)} · Out ${fmt(tout)}</div>Yesterday, all businesses.<div class="acts"><button data-a="biz">Each business</button><button data-a="bills">2 bills to approve</button><button data-a="today">Today</button></div>`,false,300);
}
function each(){const rows=BIZ.map(b=>`<tr><td>${b[0]} ${b[1]}</td><td>${fmt(b[2]-b[3])}</td></tr>`).join('');return say(`Net, yesterday:<table>${rows}</table><span class="t">Tap a name in the live panel for its week.</span>`)}
function bills(){return say(`<div class="bill"><div class="w">⚡ Electric · Hostel<br><b>${fmt(4820)}</b></div><button class="y">✓</button><button class="n">✕</button></div><div class="bill"><div class="w">📣 Ad agency · Tours<br><b>${fmt(18000)}</b> <span class="t">· 0 bookings from it in 60 days</span></div><button class="y">✓</button><button class="n">✕</button></div>`)}
function today(){return say(`Today:<br>🚤 14 boat pickups, 05:00<br>🛂 2 visa clients, 10:30 and 14:00<br>👜 3 consignors bringing pieces<br>💱 USD board updated 10:01`)}
const A={
 exchange:`September, exchange:<div class="big">Net ${fmt(38600)}</div>Best day 12 Sep. USD 50–100 was 61% of it.`,
 bill:`This week:<br>⚡ Electric, Hostel ${fmt(4820)} · Fri<br>🌐 Website, Tours ${fmt(2400)} · Sat<br>📣 Ad agency, Tours ${fmt(18000)} · Sun`,
 hostel:`Tonight: <b>18 of 20 beds</b>. Two left, both upper bunks.`,
 visa:`6 cases due in 7 days. 2 need a photo from the client. I sent them a LINE.`,
 cut:`Found 4, all running every month:<br>📣 Ad agency, Tours ${fmt(18000)}, 0 bookings in 60 days<br>🖥️ Booking app, Hostel ${fmt(1900)}, last login March<br>📦 Two POS apps, Consignment ${fmt(1200)}, one unused<br><b>${fmt(21100)} a month</b>`,
 th:`วันนี้ถึงตอนนี้: <b>${fmt(61250)}</b> ทุกธุรกิจรวมกัน`,
 none:`In the live panel, this question reads your sheets and answers here.`
};
function answer(q){const s=q.toLowerCase();
 if(/exchange|แลก/.test(s))return A.exchange; if(/bill|บิล/.test(s))return A.bill; if(/hostel|bed|ห้อง/.test(s))return A.hostel;
 if(/visa|วีซ่า/.test(s))return A.visa; if(/nobody|cut|paying|waste/.test(s))return A.cut; if(/วันนี้|ยอด|today|sales/.test(s))return A.th; return A.none}
async function ask(q){await say(q.replace(/</g,'&lt;'),true);await say(answer(q),false,600)}
chat.addEventListener('click',async e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.a){b.disabled=true;const t=b.dataset.a;await say(b.textContent,true);if(t==='biz')each();if(t==='bills')bills();if(t==='today')today();return}
  if(b.classList.contains('y')||b.classList.contains('n')){const row=b.closest('.bill');row.querySelectorAll('button').forEach(x=>x.remove());row.insertAdjacentHTML('beforeend',b.classList.contains('y')?'<b style="color:#06a548">Paid ✓</b>':'<b style="color:#c33">Stopped ✕</b>')}
});
document.querySelectorAll('[data-q]').forEach(c=>c.onclick=()=>ask(c.dataset.q));
document.getElementById('f').onsubmit=e=>{e.preventDefault();const q=document.getElementById('q');if(q.value.trim()){ask(q.value.trim());q.value=''}};
morning();
</script>
<script src="../deck.js?v=4"></script>
</body></html>
